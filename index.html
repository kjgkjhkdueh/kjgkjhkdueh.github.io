<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procedural Lightning Matrix Engine</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --panel-bg: #1f2833;
            --accent-blue: #45f3ff;
            --accent-overload: #ff0055;
            --text-main: #c5a1ff;
            --text-sub: #111;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        #control-panel {
            width: 360px;
            background-color: var(--panel-bg);
            padding: 20px;
            box-sizing: border-box;
            border-right: 2px solid var(--accent-blue);
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
            z-index: 10;
            box-shadow: 5px 0 15px rgba(0, 0, 0, 0.5);
        }

        h1, h2 {
            margin: 0;
            color: var(--accent-blue);
            text-transform: uppercase;
        }

        h1 { font-size: 1.4rem; border-bottom: 1px solid #333; padding-bottom: 5px;}
        h2 { font-size: 1rem; margin-top: 10px; color: #a1c5ff;}

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
        }

        .val-display {
            color: var(--accent-blue);
        }

        input[type="range"], input[type="text"], select, button {
            width: 100%;
            background: #0b0c10;
            color: #fff;
            border: 1px solid var(--accent-blue);
            padding: 8px;
            font-family: inherit;
            box-sizing: border-box;
        }

        input[type="range"] {
            padding: 0;
            accent-color: var(--accent-blue);
        }

        input[type="text"] {
            border-style: dashed;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input[type="text"]:focus {
            outline: none;
            border-style: solid;
            background: #151b24;
        }

        button {
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover {
            background: var(--accent-blue);
            color: var(--text-sub);
            font-weight: bold;
            box-shadow: 0 0 10px var(--accent-blue);
        }

        #status-panel {
            border-top: 1px solid #333;
            padding-top: 15px;
            font-size: 0.85rem;
            line-height: 1.5;
            color: #858585;
        }

        .status-val {
            color: #00ffcc;
        }

        #viewport {
            flex-grow: 1;
            position: relative;
            background: #000;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .overload-banner {
            display: none;
            color: var(--accent-overload);
            font-weight: bold;
            text-align: center;
            animation: blink 0.5s infinite alternate;
            font-size: 0.9rem;
            border: 1px solid var(--accent-overload);
            padding: 5px;
            background: rgba(255, 0, 85, 0.1);
        }

        @keyframes blink {
            from { opacity: 0.3; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="control-panel">
        <h1>⚡ Discharge Engine</h1>
        <div>High-Precision Lightning Simulation Matrix</div>
        
        <button id="strike-btn">Force Plasma Strike</button>

        <h2>Matrix Overrides</h2>
        <div class="control-group">
            <input type="text" id="override-code" placeholder="Enter System Code...">
            <div id="overload-status" class="overload-banner">⚠️ SYSTEM OVERLOAD ACTIVE ⚠️</div>
        </div>

        <h2>Discharge Tuning</h2>
        <div class="control-group">
            <label>Lightning Type</label>
            <select id="cfg-type">
                <option value="standard">Standard Ground Strike</option>
                <option value="forked">Heavy Forked Discharge</option>
                <option value="sheet">Cloud-to-Cloud Sheet Plasma</option>
                <option value="bead">Bead Chain Lightning</option>
                <option value="ball">Ascending Ball Lightning</option>
            </select>
        </div>
        <div class="control-group">
            <label>Lightning Per Second (LPS): <span class="val-display" id="lbl-lps">1.0</span></label>
            <input type="range" id="cfg-lps" min="0.1" max="15.0" step="0.1" value="1.0">
        </div>
        <div class="control-group">
            <label>Plasma Noise Level: <span class="val-display" id="lbl-noise">15px</span></label>
            <input type="range" id="cfg-noise" min="0" max="50" step="1" value="15">
        </div>

        <h2>Intensity Matrix</h2>
        <div class="control-group">
            <label>Core Luminance: <span class="val-display" id="lbl-luminance">1.00</span></label>
            <input type="range" id="cfg-luminance" min="0.1" max="2.0" step="0.05" value="1.00">
        </div>
        <div class="control-group">
            <label>Glow Radius Spread: <span class="val-display" id="lbl-glow">30px</span></label>
            <input type="range" id="cfg-glow" min="5" max="60" step="1" value="30">
        </div>
        <div class="control-group">
            <label>Dielectric Core Width: <span class="val-display" id="lbl-width">3.5px</span></label>
            <input type="range" id="cfg-width" min="1.0" max="10.0" step="0.5" value="3.5">
        </div>
        <div class="control-group">
            <label>Branch Energy Dissipation: <span class="val-display" id="lbl-dissipation">0.60</span></label>
            <input type="range" id="cfg-dissipation" min="0.1" max="0.9" step="0.05" value="0.60">
        </div>

        <h2>Range & Spatial Limits</h2>
        <div class="control-group">
            <label>Vertical Range Extension: <span class="val-display" id="lbl-vrange">95%</span></label>
            <input type="range" id="cfg-vrange" min="50" max="100" step="5" value="95">
        </div>
        <div class="control-group">
            <label>Horizontal Deviation Bounds: <span class="val-display" id="lbl-deviation">140px</span></label>
            <input type="range" id="cfg-deviation" min="20" max="300" step="10" value="140">
        </div>
        <div class="control-group">
            <label>Stochastic Fork Probability: <span class="val-display" id="lbl-fork">0.28</span></label>
            <input type="range" id="cfg-fork" min="0.0" max="0.6" step="0.02" value="0.28">
        </div>
        <div class="control-group">
            <label>Fractal Generation Depth: <span class="val-display" id="lbl-depth">5</span></label>
            <input type="range" id="cfg-depth" min="1" max="8" step="1" value="5">
        </div>

        <h2>Atmospheric Composition</h2>
        <div class="control-group">
            <label>Ionization Color Spectrum</label>
            <select id="cfg-color">
                <option value="#45f3ff">Electric Sapphire Blue</option>
                <option value="#ffffff">Hyperthermic Clean White</option>
                <option value="#b026ff">Superheated Violet Plasma</option>
                <option value="#ff3333">Volcanic Crimson Arc</option>
                <option value="#00ff66">Gamma Ionized Green</option>
            </select>
        </div>
        <div class="control-group">
            <label>Ambient Cloud Illumination: <span class="val-display" id="lbl-ambient">0.45</span></label>
            <input type="range" id="cfg-ambient" min="0.0" max="1.0" step="0.05" value="0.45">
        </div>

        <div id="status-panel">
            <div>Engine Status: <span class="status-val" id="engine-status">OPERATIONAL</span></div>
            <div>Total Segments: <span class="status-val" id="stat-segments">0</span></div>
            <div>Active Branches: <span class="status-val" id="stat-branches">0</span></div>
            <div>Render Context: <span class="status-val" style="color:#a1c5ff;">Canvas2D Multi-Bake</span></div>
        </div>
    </div>

    <div id="viewport">
        <canvas id="lightningCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('lightningCanvas');
        const ctx = canvas.getContext('2d');

        const strikeBtn = document.getElementById('strike-btn');
        const statSegments = document.getElementById('stat-segments');
        const statBranches = document.getElementById('stat-branches');
        const codeInput = document.getElementById('override-code');
        const overloadBanner = document.getElementById('overload-status');
        const engineStatusText = document.getElementById('engine-status');
        const lpsSlider = document.getElementById('cfg-lps');
        const noiseSlider = document.getElementById('cfg-noise');

        const config = { type: 'standard', isOverload: false };
        
        function syncControl(id, configKey, suffix = '') {
            const input = document.getElementById(`cfg-${id}`);
            const label = document.getElementById(`lbl-${id}`);
            
            const update = () => {
                let val = input.value;
                config[configKey] = parseFloat(val) || val;
                if(label) label.textContent = val + suffix;
            };
            
            input.addEventListener('input', update);
            update();
        }

        syncControl('luminance', 'luminance');
        syncControl('glow', 'glowRadius', 'px');
        syncControl('width', 'coreWidth', 'px');
        syncControl('dissipation', 'dissipation');
        syncControl('vrange', 'verticalRange', '%');
        syncControl('deviation', 'deviation', 'px');
        syncControl('fork', 'forkProb');
        syncControl('depth', 'depth');
        syncControl('ambient', 'ambient');
        syncControl('lps', 'lps');
        syncControl('noise', 'noise', 'px');

        const colorSelect = document.getElementById('cfg-color');
        colorSelect.addEventListener('change', () => config.color = colorSelect.value);
        config.color = colorSelect.value;

        const typeSelect = document.getElementById('cfg-type');
        typeSelect.addEventListener('change', () => config.type = typeSelect.value);
        config.type = typeSelect.value;

        // Secret Code Unlock Execution
        codeInput.addEventListener('input', () => {
            if (codeInput.value.trim().toUpperCase() === 'LIGHTNINGISCOOL!') {
                config.isOverload = true;
                overloadBanner.style.display = 'block';
                engineStatusText.textContent = 'SUPERCHARGED OVERLOAD';
                engineStatusText.style.color = '#ff0055';
                
                // Break input boundaries
                lpsSlider.max = "60.0";
                noiseSlider.max = "200";
                
                // Set Overload conditions
                lpsSlider.value = "45.0";
                noiseSlider.value = "120";
                
                // Trigger events to sync display text metrics
                lpsSlider.dispatchEvent(new Event('input'));
                noiseSlider.dispatchEvent(new Event('input'));
                
                document.documentElement.style.setProperty('--accent-blue', '#ff0055');
                codeInput.disabled = true;
                codeInput.style.borderColor = '#ff0055';
            }
        });

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let activeBakes = [];
        let metrics = { segments: 0, branches: 0 };
        let lastDischargeTime = performance.now();

        class Segment {
            constructor(x1, y1, x2, y2, width) {
                this.x1 = x1; this.y1 = y1;
                this.x2 = x2; this.y2 = y2;
                this.width = width;
            }
        }

        // Recursive lightning with atmospheric fractal noise
        function generateLightningBranch(x1, y1, x2, y2, maxDeviation, depth, width) {
            let segments = [];
            metrics.branches++;

            function subdivide(xa, ya, xb, yb, currentDev, currentDepth, currentWidth) {
                if (currentDepth <= 0) {
                    segments.push(new Segment(xa, ya, xb, yb, currentWidth));
                    metrics.segments++;
                    return;
                }

                let midX = (xa + xb) / 2;
                let midY = (ya + yb) / 2;

                // Combine fracture displacement with atmospheric scalar noise
                let noiseOffset = (Math.random() - 0.5) * config.noise;
                let fractureOffset = (Math.random() - 0.5) * currentDev;
                midX += fractureOffset + noiseOffset;

                // Type tuning changes probability arrays
                let baseForkChance = config.type === 'forked' ? config.forkProb * 1.6 : config.forkProb;

                if (Math.random() < baseForkChance && currentDepth > 1 && config.type !== 'bead') {
                    let forkX = midX + (Math.random() - 0.5) * currentDev * 0.8;
                    let forkY = midY + (Math.random() * (yb - ya) * 0.5);
                    
                    let forkSegments = generateLightningBranch(
                        midX, midY, forkX, forkY, 
                        currentDev * config.dissipation, 
                        currentDepth - 1, 
                        currentWidth * config.dissipation
                    );
                    segments = segments.concat(forkSegments);
                }

                subdivide(xa, ya, midX, midY, currentDev * 0.5, currentDepth - 1, currentWidth);
                subdivide(midX, midY, xb, yb, currentDev * 0.5, currentDepth - 1, currentWidth);
            }

            subdivide(x1, y1, x2, y2, maxDeviation, depth, width);
            return segments;
        }

        function triggerPlasmaStrike() {
            metrics.segments = 0;
            metrics.branches = 0;

            let strikeSegments = [];
            let strikeColor = config.isOverload ? '#ff0055' : config.color;

            // Type handling matrix pipelines
            if (config.type === 'sheet') {
                // Flash entire viewport bounding cloud matrices
                activeBakes.push({
                    type: 'sheet',
                    opacity: config.luminance,
                    ambientFlash: config.ambient * 1.5,
                    color: strikeColor,
                    metricsCache: { segments: 12, branches: 2 }
                });
                return;
            } else if (config.type === 'ball') {
                // Floating point anchor sphere
                activeBakes.push({
                    type: 'ball',
                    x: canvas.width * 0.3 + Math.random() * canvas.width * 0.4,
                    y: canvas.height * 0.8 - Math.random() * canvas.height * 0.4,
                    radius: config.coreWidth * 4 + Math.random() * 20,
                    opacity: config.luminance,
                    ambientFlash: config.ambient * 0.2,
                    color: strikeColor,
                    metricsCache: { segments: 25, branches: 1 }
                });
                return;
            }

            // Path-based strikes (Standard, Forked, Bead)
            const startX = canvas.width / 2 + (Math.random() - 0.5) * (canvas.width * 0.6);
            const startY = 0;
            const targetY = canvas.height * (config.verticalRange / 100);
            const targetX = startX + (Math.random() - 0.5) * (config.deviation * 1.5);

            strikeSegments = generateLightningBranch(
                startX, startY, targetX, targetY,
                config.deviation, config.depth, config.coreWidth
            );

            activeBakes.push({
                type: config.type, // 'standard', 'forked', or 'bead'
                segments: strikeSegments,
                opacity: config.luminance,
                ambientFlash: config.ambient,
                color: strikeColor,
                metricsCache: { ...metrics }
            });
        }

        strikeBtn.addEventListener('click', triggerPlasmaStrike);

        function renderLoop(currentTime) {
            // Background update loop frame clearing
            ctx.fillStyle = `rgba(11, 12, 16, 0.25)`;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Automated LPS delta loop clock tracking
            let lpsInterval = 1000 / config.lps;
            if (currentTime - lastDischargeTime >= lpsInterval) {
                triggerPlasmaStrike();
                lastDischargeTime = currentTime;
            }

            let engineSegments = 0;
            let engineBranches = 0;

            for (let i = activeBakes.length - 1; i >= 0; i--) {
                let strike = activeBakes[i];
                
                engineSegments += strike.metricsCache.segments;
                engineBranches += strike.metricsCache.branches;

                // Process sky glow discharges
                if (strike.ambientFlash > 0.02) {
                    ctx.fillStyle = `${strike.color}${Math.floor(strike.ambientFlash * 35).toString(16).padStart(2, '0')}`;
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    strike.ambientFlash *= 0.75; 
                }

                ctx.save();
                ctx.globalAlpha = strike.opacity;

                if (strike.type === 'sheet') {
                    // Draw smooth overlapping sky fields
                    let gradient = ctx.createRadialGradient(canvas.width/2, 0, 10, canvas.width/2, 0, canvas.height * 0.8);
                    gradient.addColorStop(0, strike.color);
                    gradient.addColorStop(1, 'transparent');
                    ctx.fillStyle = gradient;
                    ctx.globalAlpha = strike.opacity * 0.4;
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                } 
                else if (strike.type === 'ball') {
                    // Draw glowing orb structures
                    ctx.shadowBlur = config.glowRadius * 1.5;
                    ctx.shadowColor = strike.color;
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(strike.x, strike.y, strike.radius, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Spasm floating coordinates slightly
                    strike.x += (Math.random() - 0.5) * 4;
                    strike.y -= Math.random() * 2; // Floating upwards
                } 
                else {
                    // Render paths (Standard, Forked, Bead)
                    ctx.strokeStyle = strike.color;
                    ctx.shadowBlur = config.glowRadius;
                    ctx.shadowColor = strike.color;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';

                    if (strike.type === 'bead') {
                        // Pass 1: Radiating Glow
                        strike.segments.forEach(seg => {
                            ctx.beginPath();
                            ctx.arc(seg.x1, seg.y1, config.coreWidth * 1.8, 0, Math.PI * 2);
                            ctx.fillStyle = strike.color;
                            ctx.fill();
                        });
                        // Pass 2: Sharp core dots
                        ctx.shadowBlur = 0;
                        strike.segments.forEach(seg => {
                            ctx.beginPath();
                            ctx.arc(seg.x1, seg.y1, config.coreWidth * 0.8, 0, Math.PI * 2);
                            ctx.fillStyle = '#ffffff';
                            ctx.fill();
                        });
                    } else {
                        // Line-based (Standard or Forked)
                        ctx.beginPath();
                        strike.segments.forEach(seg => {
                            ctx.moveTo(seg.x1, seg.y1);
                            ctx.lineTo(seg.x2, seg.y2);
                        });
                        ctx.lineWidth = config.glowRadius * 0.2;
                        ctx.stroke();

                        ctx.shadowBlur = 0; 
                        ctx.strokeStyle = '#ffffff'; 
                        ctx.beginPath();
                        strike.segments.forEach(seg => {
                            ctx.moveTo(seg.x1, seg.y1);
                            ctx.lineTo(seg.x2, seg.y2);
                        });
                        ctx.lineWidth = seg => seg.width;
                        ctx.lineWidth = config.coreWidth;
                        ctx.stroke();
                    }
                }
                ctx.restore();

                // Fade step decay processing
                strike.opacity *= config.isOverload ? 0.94 : 0.88;

                if (strike.opacity < 0.05) {
                    activeBakes.splice(i, 1);
                }
            }

            statSegments.textContent = engineSegments;
            statBranches.textContent = engineBranches;

            requestAnimationFrame(renderLoop);
        }

        requestAnimationFrame(renderLoop);
        setTimeout(triggerPlasmaStrike, 400);
    </script>
</body>
</html>
